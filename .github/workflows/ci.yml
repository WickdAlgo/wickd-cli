name: CI

on:
  push:
    branches: [ main, stage, dev ]
  pull_request:
    branches: [ main, stage, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Wickd.Cli.slnx

    - name: Build
      run: dotnet build Wickd.Cli.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test Wickd.Cli.slnx --no-build --configuration Release --verbosity normal

    - name: Pack Tool
      run: dotnet pack src/Wickd.Cli/Wickd.Cli.csproj --no-build --configuration Release -o artifacts

    - name: Verify Clean Package Boundary (ADR 002)
      run: |
        nupkg_file=$(ls artifacts/wickd-cli.*.nupkg | head -n 1)
        scripts/verify-package.sh "$nupkg_file"

    - name: Smoke Test Packed Tool
      run: |
        nupkg_file=$(ls artifacts/wickd-cli.*.nupkg | head -n 1)
        package_version=$(basename "$nupkg_file" | sed -E 's/^wickd-cli\.(.*)\.nupkg$/\1/')
        dotnet tool install --tool-path "$RUNNER_TEMP/wickd-tool" --add-source artifacts wickd-cli --version "$package_version"
        "$RUNNER_TEMP/wickd-tool/wickd" --help
        "$RUNNER_TEMP/wickd-tool/wickd" analyze vwap --help
        "$RUNNER_TEMP/wickd-tool/wickd" run --help
